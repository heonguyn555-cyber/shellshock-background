<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kiểm tra email và mật khẩu</title>
</head>
<body>
    <h2>Đăng nhập</h2>
    <label for="email">Email:</label>
    <input type="text" id="email" placeholder="Nhập email"><br><br>

    <label for="pass">Mật khẩu:</label>
    <input type="password" id="pass" placeholder="Nhập mật khẩu"><br><br>

    <button onclick="checkLogin()">Kiểm tra</button>

    <p id="result"></p>

    <script>
        // Đây là thông tin đúng để kiểm tra
        const correctEmail = "heonguyn555@gmail.com";
        const correctPass = "heo.2011";

        function checkLogin() {
            const email = document.getElementById("email").value;
            const pass = document.getElementById("pass").value;
            const result = document.getElementById("result");

            if(email === correctEmail && pass === correctPass){
                result.textContent = "Good";
            } else {
                result.textContent = "None";
            }
        }
    </script>
</body>
</html>
